<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigation Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .menu-bar {
      background-color: navy;
      padding: 12px 16px;
      display: flex;
      gap: 20px;
    }

    .menu-bar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }

    .menu-bar a:hover {
      color: #ffcc00;
    }

    #result {
      margin-top: 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="menu-bar">
    <a href="#home" onclick="showPage('Home')">Home</a>
    <a href="#courses" onclick="showPage('Courses')">Courses</a>
    <a href="#gallery" onclick="showPage('Gallery')">Gallery</a>
    <a href="#contact" onclick="showPage('Contact')">Contact</a>
  </div>

  <div id="result"></div>

  <script>
    function showPage(pageName) {
      document.getElementById("result").textContent = "You are on the " + pageName + " page";
    }
  </script>

</body>
</html>
