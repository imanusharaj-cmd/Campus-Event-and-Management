<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id = "demo"> The submit button is hoverd</p>
    <form>
        name: <input type="text" name="name" id="name"><br>
        age: <input type="text" name="age" id="age"><br>
        <input type="submit" value="submit" id="submit-btn" onmouseover="submitfunction()">
    </form>
    <script>
        let count = 0;
        function submitfunction() {
           count = count + 1;
            document.getElementById("demo").innerHTML = "The submit button has been hovered " + count + " times.";
            document.getElementById("submit-btn").style.backgroundColor = "red";
    
        }
    </script>
</body>
</html>
