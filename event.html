<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Event Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>🎓 CampusConnect</h2>

        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <button onclick="showAdmin()">Admin</button>
        </nav>
    </header>

    <!-- Home Section -->
    <section class="hero" id="home">
        <h1>Welcome to Campus Events!</h1>
        <p>Discover events, participate and make memories.</p>
        <a href="#events" class="btn">Explore Events</a>
    </section>

    <!-- Events Section -->
    <section id="events">
        <h2>Upcoming Events</h2>

        <div class="event-container" id="eventContainer">
        </div>
    </section>

    <!-- Registration Section -->
    <section id="registration" class="hidden">
        <h2>Event Registration</h2>

        <form id="registrationForm">

            <input type="text" id="studentName"
                   placeholder="Enter your Name" required>

            <input type="text" id="studentId"
                   placeholder="Enter Student ID" required>

            <input type="email" id="studentEmail"
                   placeholder="Enter Email" required>

            <input type="hidden" id="eventName">

            <button type="submit">Register</button>

        </form>
    </section>

    <!-- Admin Section -->
    <section id="admin" class="hidden">

        <h2>Admin Dashboard</h2>

        <h3>Add New Event</h3>

        <form id="eventForm">

            <input type="text" id="newEvent"
                   placeholder="Event Name" required>

            <input type="date" id="eventDate" required>

            <input type="number" id="eventSeats"
                   placeholder="Total Seats" min="1" required>

            <button type="submit">Add Event</button>

        </form>

        <h3>Registered Students</h3>

        <div id="studentList"></div>

    </section>

    <footer>
        <p>CampusConnect | Campus Event Management Portal</p>
        <p>Created using HTML, CSS and JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
